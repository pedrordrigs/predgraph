[project]
name = "predgraph"
version = "0.1.0"
description = "Temporal prediction-market intelligence graph: news pressure (R) vs realized repricing (D)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rustworkx>=0.15",
    "apscheduler>=3.10",
    "rich>=13.7",
]

[project.scripts]
predgraph = "predgraph.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["predgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
