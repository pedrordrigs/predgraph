[project]
name = "predgraph"
version = "0.1.0"
description = "Temporal prediction-market intelligence graph: news pressure (R) vs realized repricing (D)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "rich>=13.7",
    # Core, not an extra: the hosted dashboard installs from this file (Vercel
    # ignores requirements.txt when a pyproject exists), so an optional FastAPI
    # is simply an absent one, and the function fails to import.
    "fastapi>=0.111",
]

[project.optional-dependencies]
# Cloud deployment stores everything in Postgres; SQLite stays the local default.
postgres = ["psycopg[binary]>=3.1"]
# Only needed to serve locally; the hosted deployment supplies its own server.
web = ["uvicorn>=0.30"]

[project.scripts]
predgraph = "predgraph.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["predgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# The schema stores naive UTC throughout, so fixtures construct naive datetimes.
"tests/*" = ["DTZ001"]
