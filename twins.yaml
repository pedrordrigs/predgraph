# Cross-venue twins: the same real-world claim listed on both venues.
#
# This is the instrument's calibration standard. Two venues quoting the same
# question must agree when one of them reprices materially — there is no
# structural reason for them to diverge, unlike two strikes of one ladder
# (news that sharpens the distribution legitimately moves "above 3.75%" and
# "above 4.25%" in opposite directions, so same-ladder agreement has a ceiling
# below 100% and is the wrong calibration standard).
#
# If twin agreement is high, the measurement pipeline works and any weak n-hop
# result is a fact about the world. If it is low, the pipeline is broken and no
# hop-level number should be believed. Their lead/lag is also interesting in its
# own right: venue-to-venue lag is the thesis in miniature.
#
# Set `opposite: true` when the twin states the claim inverted.
# Verified 2026-07-31; re-check ids after these markets resolve.

