name: collect

# The bot needs a 60-second heartbeat, which no free serverless platform will
# give you: Vercel's Hobby cron fires once a day and its functions die in
# seconds. GitHub's cron is also unreliable - a 5-minute floor, routinely
# delayed under load, and sometimes dropped entirely - but a *job* may run for
# hours. So the job, not the schedule, carries the cadence: each run polls on
# its own 60s timer for ~5h50m. Entering 30 minutes after a spike gives up most
# of the measured edge, so a gap is lost trades, not just lost rows.
#
# Depending on an hourly cron to restart a 55-minute run was the earlier
# design, and it failed the first time a tick was dropped: collection simply
# stopped with nothing queued. Now the cron only has to land once every ~6
# hours, and if ACTIONS_PAT is set each run also dispatches its own successor.
on:
  schedule:
    # Offset from :00 and :30 deliberately - those are the most contended
    # minutes on GitHub's scheduler, and a run there is routinely delayed or
    # dropped outright. A dropped 00:00 tick is exactly what stopped
    # collection once already.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to poll
        default: "350"

concurrency:
  # Two collectors at once would double-count signals and race on writes.
  # Queueing rather than cancelling is what makes the overlapping schedule
  # above work: the waiting run is the handover, not a duplicate.
  group: collector
  cancel-in-progress: false

permissions:
  # The chaining step authenticates with ACTIONS_PAT, not GITHUB_TOKEN, so the
  # workflow's own token never needs more than checkout.
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # Just under the 6-hour hosted-runner ceiling. Long runs are what make
    # this robust: coverage depends on the cron landing once every ~6 hours
    # rather than every hour, so several dropped ticks in a row cost nothing
    # while a run is still going.
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .   # psycopg and fastapi are core deps, not extras

      - name: Collect
        env:
          PREDGRAPH_DB_URL: ${{ secrets.PREDGRAPH_DB_URL }}
          PREDGRAPH_LOG_LEVEL: INFO
        run: |
          predgraph collect \
            --minutes "${{ github.event.inputs.minutes || '350' }}" \
            --interval 60

      - name: Chain the next run
        # GITHUB_TOKEN deliberately cannot trigger further workflow runs, so
        # self-chaining needs a PAT. The presence check has to happen in the
        # shell, not in `if:` - `secrets` is not one of the contexts allowed in
        # a step condition, and referencing it there makes the whole workflow
        # file invalid, which GitHub reports only as a nameless failed run.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No ACTIONS_PAT set - the hourly cron carries the schedule."
            exit 0
          fi
          gh workflow run collect.yml --repo "$GITHUB_REPOSITORY"
