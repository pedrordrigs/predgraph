domain: macro_fed
version: 1

# Every latent/indicator node declares an axis. Signs on edges compose along a
# path, so "higher = X" is what makes a 3-hop direction claim auditable.
nodes:
  - id: inflation_pressure_us
    kind: latent
    label: US inflation pressure
    axis: higher = broad US consumer price pressure rising
    aliases: [inflation, price pressure, CPI pressure]

  - id: labor_market_tightness_us
    kind: latent
    label: US labor market tightness
    axis: higher = tighter labor market (more hiring, fewer available workers)
    aliases: [labor market, jobs market, hiring]

  - id: growth_momentum_us
    kind: latent
    label: US growth momentum
    axis: higher = stronger US real economic activity
    aliases: [growth, economic activity, GDP momentum]

  - id: recession_risk_us
    kind: latent
    label: US recession risk
    axis: higher = greater probability of a US recession
    aliases: [recession, downturn, hard landing]

  - id: fed_policy_dovishness
    kind: latent
    label: Fed policy dovishness
    axis: higher = FOMC more inclined to ease (cut rates, slow QT)
    aliases: [Fed stance, monetary policy stance, FOMC leaning]

  - id: financial_conditions_looseness
    kind: latent
    label: Financial conditions looseness
    axis: higher = looser financial conditions (cheaper credit, higher risk assets)
    aliases: [financial conditions, credit conditions]

  - id: fiscal_impulse_us
    kind: latent
    label: US fiscal impulse
    axis: higher = more expansionary US fiscal stance
    aliases: [fiscal policy, government spending, stimulus]

  - id: tariff_intensity_us
    kind: latent
    label: US tariff intensity
    axis: higher = heavier effective tariff burden on US imports
    aliases: [tariffs, trade barriers, import duties]

  - id: energy_cost_passthrough
    kind: latent
    label: Energy cost passthrough
    axis: higher = energy costs feeding harder into US consumer prices
    aliases: [energy passthrough, fuel costs]

  - id: dollar_strength
    kind: latent
    label: US dollar strength
    axis: higher = stronger USD versus major currencies
    aliases: [dollar, DXY, greenback]

  - id: cpi_us
    kind: indicator
    label: US CPI
    axis: higher = higher reported US CPI inflation
    aliases: [CPI, consumer price index]

  - id: pce_core_us
    kind: indicator
    label: US core PCE
    axis: higher = higher reported core PCE inflation
    aliases: [core PCE, PCE deflator]

  - id: nfp_us
    kind: indicator
    label: US nonfarm payrolls
    axis: higher = stronger payroll job gains
    aliases: [nonfarm payrolls, NFP, jobs report]

  - id: unemployment_rate_us
    kind: indicator
    label: US unemployment rate
    axis: higher = higher measured unemployment rate
    aliases: [unemployment rate, jobless rate]

  - id: ust10y_yield
    kind: indicator
    label: US 10-year Treasury yield
    axis: higher = higher 10-year Treasury yield
    aliases: [10-year yield, treasury yields, long rates]

  - id: gasoline_price_us
    kind: indicator
    label: US retail gasoline price
    axis: higher = higher US pump prices
    aliases: [gas prices, gasoline, pump prices]

  - id: fomc
    kind: entity
    label: Federal Open Market Committee
    aliases: [FOMC, Federal Reserve, the Fed]

  - id: jerome_powell
    kind: entity
    label: Jerome Powell
    aliases: [Powell, Fed chair, Fed chairman]

  - id: us_treasury
    kind: entity
    label: US Treasury
    aliases: [Treasury Department, Treasury]

  - id: bls
    kind: entity
    label: Bureau of Labor Statistics
    aliases: [BLS, Labor Department]

  - id: white_house
    kind: entity
    label: White House
    aliases: [the administration, President, Oval Office]

  - id: fomc_meeting
    kind: event_calendar
    label: FOMC meeting
    aliases: [FOMC decision, rate decision, Fed meeting]

  - id: cpi_release
    kind: event_calendar
    label: CPI release
    aliases: [CPI report, inflation report]

  - id: nfp_release
    kind: event_calendar
    label: Payrolls release
    aliases: [jobs report, employment situation]

# delay_h is how long the effect takes to arrive; halflife_h is how fast the
# mechanism's relevance decays. Priors here are hand-set and get calibrated
# against realized repricing in the M1 lag study.
edges:
  - src: cpi_us
    dst: inflation_pressure_us
    sign: 1
    weight: 0.9
    delay_h: 0
    halflife_h: 336
    mechanism: CPI print is a direct observation of price pressure

  - src: pce_core_us
    dst: inflation_pressure_us
    sign: 1
    weight: 0.85
    delay_h: 0
    halflife_h: 336
    mechanism: core PCE is the Fed's preferred inflation gauge

  - src: gasoline_price_us
    dst: inflation_pressure_us
    sign: 1
    weight: 0.5
    delay_h: 336
    halflife_h: 720
    mechanism: pump prices feed the energy component of CPI

  - src: brent_price
    dst: gasoline_price_us
    sign: 1
    weight: 0.8
    delay_h: 168
    halflife_h: 336
    mechanism: crude costs pass through to retail gasoline within weeks

  - src: brent_price
    dst: energy_cost_passthrough
    sign: 1
    weight: 0.7
    delay_h: 336
    halflife_h: 1440
    mechanism: sustained crude costs raise input costs economy-wide

  - src: energy_cost_passthrough
    dst: inflation_pressure_us
    sign: 1
    weight: 0.6
    delay_h: 720
    halflife_h: 1440
    mechanism: energy input costs lift core goods and services prices

  # Deliberate shortcut alongside the detailed chain above. Analysts compress
  # "oil up therefore inflation up" into a single step, and without it the
  # flagship path (escalation -> oil -> inflation -> Fed -> market) sits at 6
  # hops, past any sane cap. Top-k damping keeps the two from double-counting.
  - src: brent_price
    dst: inflation_pressure_us
    sign: 1
    weight: 0.45
    delay_h: 504
    halflife_h: 1440
    mechanism: aggregate crude passthrough to consumer prices (compressed)

  - src: inflation_pressure_us
    dst: fed_policy_dovishness
    sign: -1
    weight: 0.85
    delay_h: 24
    halflife_h: 336
    mechanism: higher inflation removes room to ease

  - src: nfp_us
    dst: labor_market_tightness_us
    sign: 1
    weight: 0.8
    delay_h: 0
    halflife_h: 336
    mechanism: payroll gains are a direct read on labor demand

  - src: unemployment_rate_us
    dst: labor_market_tightness_us
    sign: -1
    weight: 0.85
    delay_h: 0
    halflife_h: 336
    mechanism: rising unemployment means a looser labor market

  - src: labor_market_tightness_us
    dst: inflation_pressure_us
    sign: 1
    weight: 0.5
    delay_h: 720
    halflife_h: 720
    mechanism: tight labor markets push wage-driven services inflation

  - src: labor_market_tightness_us
    dst: fed_policy_dovishness
    sign: -1
    weight: 0.7
    delay_h: 24
    halflife_h: 336
    mechanism: a tight labor market removes urgency to ease

  - src: unemployment_rate_us
    dst: recession_risk_us
    sign: 1
    weight: 0.7
    delay_h: 0
    halflife_h: 336
    mechanism: rising unemployment is the classic recession signal

  - src: growth_momentum_us
    dst: recession_risk_us
    sign: -1
    weight: 0.8
    delay_h: 24
    halflife_h: 336
    mechanism: stronger activity reduces recession odds

  - src: recession_risk_us
    dst: fed_policy_dovishness
    sign: 1
    weight: 0.75
    delay_h: 12
    halflife_h: 336
    mechanism: recession risk pulls the Fed toward easing

  - src: fed_policy_dovishness
    dst: ust10y_yield
    sign: -1
    weight: 0.6
    delay_h: 1
    halflife_h: 168
    mechanism: expected easing lowers the rate path priced into the curve

  - src: fed_policy_dovishness
    dst: financial_conditions_looseness
    sign: 1
    weight: 0.7
    delay_h: 1
    halflife_h: 168
    mechanism: expected easing loosens financial conditions immediately

  - src: fed_policy_dovishness
    dst: dollar_strength
    sign: -1
    weight: 0.6
    delay_h: 1
    halflife_h: 168
    mechanism: lower expected rates reduce dollar carry appeal

  - src: dollar_strength
    dst: inflation_pressure_us
    sign: -1
    weight: 0.4
    delay_h: 720
    halflife_h: 1440
    mechanism: a stronger dollar makes imports cheaper

  - src: tariff_intensity_us
    dst: inflation_pressure_us
    sign: 1
    weight: 0.6
    delay_h: 1440
    halflife_h: 2160
    mechanism: tariffs raise landed import costs with a lag

  - src: fiscal_impulse_us
    dst: growth_momentum_us
    sign: 1
    weight: 0.5
    delay_h: 2160
    halflife_h: 4320
    mechanism: fiscal expansion supports demand over quarters

  - src: financial_conditions_looseness
    dst: growth_momentum_us
    sign: 1
    weight: 0.5
    delay_h: 1440
    halflife_h: 2160
    mechanism: looser conditions support investment and consumption

  - src: ust10y_yield
    dst: financial_conditions_looseness
    sign: -1
    weight: 0.6
    delay_h: 24
    halflife_h: 336
    mechanism: higher long rates tighten borrowing conditions

# Anchors attach discovered markets to the node that drives them. They are
# written as provisional edges for the daily curator to confirm — keyword
# matching is a starting guess, not a verdict.
market_anchors:
  - id: fed_cut_markets
    driver: fed_policy_dovishness
    sign: 1
    weight: 0.9
    delay_h: 1
    halflife_h: 168
    mechanism: dovish drift raises the odds of a cut being priced
    match:
      any_of: [rate cut, cut rates, decrease rates, fed cuts, lower rates]
      none_of: [hike, raise rates, increase rates]

  - id: fed_hike_markets
    driver: fed_policy_dovishness
    sign: -1
    weight: 0.9
    delay_h: 1
    halflife_h: 168
    mechanism: dovish drift lowers the odds of a hike
    match:
      any_of: [rate hike, hike rates, raise rates, increase rates]
      # Kalshi expresses "hold" as "Hike rates by 0bps / Fed maintains", which
      # is a different claim and gets its own weaker anchor below.
      none_of: [0bps, maintains]

  - id: fed_maintains_markets
    driver: fed_policy_dovishness
    sign: -1
    weight: 0.5
    delay_h: 1
    halflife_h: 168
    mechanism: dovish drift lowers the odds the Fed holds steady
    match:
      any_of: [0bps, fed maintains]

  - id: fed_hold_markets
    driver: fed_policy_dovishness
    sign: -1
    weight: 0.5
    delay_h: 1
    halflife_h: 168
    mechanism: dovish drift lowers the odds of no change
    match:
      all_of: [fed]
      any_of: [no change, hold rates, unchanged]

  - id: recession_markets
    driver: recession_risk_us
    sign: 1
    weight: 0.9
    delay_h: 6
    halflife_h: 336
    mechanism: direct read on recession probability
    match:
      any_of: [recession]

  # Real phrasing is "will the rate of CPI inflation be above 2.5% for the year
  # ending in August" — narrow keyword matching missed all of it. Broad terms are
  # safe because Kalshi discovery is scoped to curated series.
  - id: inflation_level_markets
    driver: inflation_pressure_us
    sign: 1
    weight: 0.85
    delay_h: 2
    halflife_h: 336
    mechanism: markets on CPI thresholds track inflation pressure directly
    match:
      any_of: [cpi, inflation]
      none_of: [brazil, turkey, russian, united kingdom, uk core]

  - id: gdp_growth_markets
    driver: growth_momentum_us
    sign: 1
    weight: 0.85
    delay_h: 6
    halflife_h: 336
    mechanism: direct read on realized growth
    match:
      any_of: [real gdp, gdp growth, nominal gdp]
      none_of: [brazil, european union, uk, china]

  - id: unemployment_markets
    driver: unemployment_rate_us
    sign: 1
    weight: 0.85
    delay_h: 2
    halflife_h: 336
    mechanism: direct read on the unemployment print
    match:
      any_of: [unemployment, jobless rate]

  # Kalshi's Fed markets are phrased as rate thresholds ("will the upper bound
  # of the federal funds rate be above 4.25%"), not as "cut"/"hike", so they
  # need their own anchors — and the direction flips between above and below.
  - id: fed_funds_above_markets
    driver: fed_policy_dovishness
    sign: -1
    weight: 0.9
    delay_h: 1
    halflife_h: 168
    mechanism: dovish drift lowers the odds rates stay above a threshold
    match:
      any_of: [federal funds rate, fed funds rate]
      none_of: [below]

  - id: fed_funds_below_markets
    driver: fed_policy_dovishness
    sign: 1
    weight: 0.9
    delay_h: 1
    halflife_h: 168
    mechanism: dovish drift raises the odds rates fall below a threshold
    match:
      all_of: [federal funds rate]
      any_of: [below]

  - id: tariff_markets
    driver: tariff_intensity_us
    sign: 1
    weight: 0.8
    delay_h: 6
    halflife_h: 336
    mechanism: direct read on tariff policy
    match:
      any_of: [tariff, tariffs]

  - id: treasury_yield_markets
    driver: ust10y_yield
    sign: 1
    weight: 0.85
    delay_h: 1
    halflife_h: 168
    mechanism: direct read on the 10-year yield
    match:
      any_of: [10 year treasury, 10-year treasury, ust 10, treasury yield]

# Series verified to have OPEN markets on 2026-07-31 by scanning live events.
# The legacy short tickers (RATECUT, U3, PAYROLLS, RECSSNBER, PCECORE...) still
# exist in /series but have zero open markets — they are retired, and listing
# them just burns requests.
kalshi_series:
  # Fed path
  - KXFED
  - KXFEDDECISION
  - KXFEDFUNDSYEAR
  # Inflation
  - KXCPI
  - KXCPICORE
  - KXCPIYOY
  - KXCPICOREYOY
  - KXUSCPIYEAR
  - KXECONSTATCPI
  - KXECONSTATCPIYOY
  - KXECONSTATCORECPIYOY
  - KXUSGASCPI
  # Labor
  - KXU3
  - KXU3MAX
  - KXECONSTATU3
  # Growth / recession
  - KXGDP
  - KXGDPYEAR
  - KXRECSSNBER
  # Policy and rates
  - KXNEWTARIFFS
  - KXTARIFFRATEPRC
  - KXTARIFFRATEEU
  - KXTARIFFREVENUE
  - KXUST10AD
